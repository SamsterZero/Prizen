name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prizen
          POSTGRES_PASSWORD: prizen-ci
          POSTGRES_DB: prizen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prizen -d prizen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgres://prizen:prizen-ci@127.0.0.1:5432/prizen
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      TRACKER_TOKEN: ci-only-tracker-token-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Check formatting and lint
        run: bun run lint

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Run database integration tests
        env:
          ALLOW_INTEGRATION_DB_RESET: 'true'
        run: bun run test:integration

      - name: Build application
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      TRACKER_TOKEN: ci-only-tracker-token-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject missing runtime secrets
        run: |
          if env -u SECRET_ENCRYPTION_KEY -u TRACKER_TOKEN docker compose config >/dev/null 2>&1; then
            echo 'Compose unexpectedly accepted missing runtime secrets.'
            exit 1
          fi

      - name: Build and start container stack
        run: |
          docker compose down --volumes
          docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify application health
        run: curl --fail --show-error http://127.0.0.1:3000/api/health

      - name: Verify tracker restart recovery
        run: |
          docker compose restart tracker
          docker compose up --detach --wait --wait-timeout 180 tracker

      - name: Verify one-command release installation
        run: |
          docker compose down --volumes
          PRIZEN_IMAGE=prizen:local PRIZEN_PORT=3000 docker compose \
            -p prizen-release-ci -f compose.release.yaml up --detach --wait --wait-timeout 180
          curl --fail --show-error http://127.0.0.1:3000/api/health

      - name: Verify generated secrets survive initialization
        run: |
          before="$(PRIZEN_IMAGE=prizen:local docker compose -p prizen-release-ci \
            -f compose.release.yaml run --rm --entrypoint sh init \
            -c 'sha256sum /run/secrets/prizen/*')"
          PRIZEN_IMAGE=prizen:local docker compose -p prizen-release-ci \
            -f compose.release.yaml run --rm init
          after="$(PRIZEN_IMAGE=prizen:local docker compose -p prizen-release-ci \
            -f compose.release.yaml run --rm --entrypoint sh init \
            -c 'sha256sum /run/secrets/prizen/*')"
          test "$before" = "$after"

      - name: Verify upgrade from the latest stable schema
        run: bash scripts/test-release-upgrade.sh

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          PRIZEN_IMAGE=prizen:local docker compose -p prizen-release-ci \
            -f compose.release.yaml logs --no-color

      - name: Stop container stack
        if: always()
        run: |
          docker compose down --volumes
          PRIZEN_IMAGE=prizen:local docker compose -p prizen-release-ci \
            -f compose.release.yaml down --volumes

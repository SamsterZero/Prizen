name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prizen
          POSTGRES_PASSWORD: prizen-ci
          POSTGRES_DB: prizen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prizen -d prizen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgres://prizen:prizen-ci@127.0.0.1:5432/prizen
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      TRACKER_TOKEN: ci-only-tracker-token-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Check formatting and lint
        run: bun run lint

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Build application
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      TRACKER_TOKEN: ci-only-tracker-token-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and start container stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify application health
        run: curl --fail --show-error http://127.0.0.1:3000/api/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes

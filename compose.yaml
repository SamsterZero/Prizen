services:
  app:
    image: prizen:local
    pull_policy: never
    build: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
      ORIGIN: http://localhost:3000
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY}
      TRACKER_TOKEN: ${TRACKER_TOKEN:?Set TRACKER_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) process.exit(1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  tracker:
    image: prizen:local
    pull_policy: never
    restart: unless-stopped
    command: bun scripts/tracker.ts
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
      APP_URL: http://app:3000
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY}
      TRACKER_TOKEN: ${TRACKER_TOKEN:?Set TRACKER_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', 'scripts/tracker-health.ts']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  db:
    image: postgres
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:

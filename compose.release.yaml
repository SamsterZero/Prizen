name: prizen

x-prizen-image: &prizen-image ${PRIZEN_IMAGE:-ghcr.io/samsterzero/prizen:latest}
x-prizen-secrets: &prizen-secrets
  - prizen_secrets:/run/secrets/prizen:ro

services:
  init:
    image: *prizen-image
    restart: 'no'
    entrypoint: ['bun', 'scripts/init-secrets.ts']
    environment:
      PRIZEN_DATABASE_PASSWORD: ${PRIZEN_DATABASE_PASSWORD:-}
    volumes:
      - prizen_secrets:/run/secrets/prizen

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRIZEN_DB_USER:-prizen}
      POSTGRES_DB: ${PRIZEN_DB_NAME:-prizen}
      POSTGRES_PASSWORD_FILE: /run/secrets/prizen/database-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - prizen_secrets:/run/secrets/prizen:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: *prizen-image
    restart: 'no'
    command: ['bun', 'run', 'db:migrate']
    environment:
      PRIZEN_DB_USER: ${PRIZEN_DB_USER:-prizen}
      PRIZEN_DB_NAME: ${PRIZEN_DB_NAME:-prizen}
    volumes: *prizen-secrets
    depends_on:
      db:
        condition: service_healthy

  app:
    image: *prizen-image
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PRIZEN_PORT:-3000}:3000
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PRIZEN_DB_USER: ${PRIZEN_DB_USER:-prizen}
      PRIZEN_DB_NAME: ${PRIZEN_DB_NAME:-prizen}
    volumes: *prizen-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) process.exit(1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tracker:
    image: *prizen-image
    restart: unless-stopped
    command: ['bun', 'scripts/tracker.ts']
    environment:
      APP_URL: http://app:3000
      PRIZEN_DB_USER: ${PRIZEN_DB_USER:-prizen}
      PRIZEN_DB_NAME: ${PRIZEN_DB_NAME:-prizen}
    volumes: *prizen-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/scripts/container-entrypoint.sh', 'bun', 'scripts/tracker-health.ts']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  prizen_secrets:
